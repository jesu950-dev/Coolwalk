name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: |
          mkdir proj
          unzip -q CoolwalkLauncher.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJ }}
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" CoolwalkLauncher.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CoolwalkLauncher.apk --title "Coolwalk Launcher" --notes "APK más reciente" --latest
