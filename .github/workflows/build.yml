name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q CoolwalkLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4
      - name: Compilar
        working-directory: Coolwalk
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log
      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "^e: " build.log | head -6 | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r l; do echo "::error::$l"; done
          grep -A4 "What went wrong" build.log | head -4 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Última versión
          files: Coolwalk/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
