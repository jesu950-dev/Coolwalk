name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q CoolwalkLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4
      - run: gradle assembleDebug --no-daemon
        working-directory: Coolwalk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Última versión
          files: Coolwalk/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
